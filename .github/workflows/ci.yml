name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c2afbcb # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e849af1223bdf6a370 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tracked security scan
        run: npm run security:scan:tracked

      - name: Dependency pin check
        run: npm run check:dependencies

      - name: Documentation consistency check
        run: npm run check:docs

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck mainnet
        run: npm run typecheck:mainnet

      - name: Build testnet bundle
        run: npm run build

      - name: Build mainnet bundle
        run: npm run build:mainnet

      - name: Build mainnet mock browser bundle
        run: npm run build:mainnet:mock-browser

      - name: Build mainnet mock harness bundle
        run: npm run build:mainnet:mock-harness:test

      - name: Wrangler dry-run (testnet)
        run: npx wrangler deploy --dry-run

      - name: Wrangler dry-run (mainnet)
        run: npx wrangler deploy --dry-run -c wrangler.mainnet.toml

      - name: Wrangler dry-run (mainnet mock harness)
        run: npx wrangler deploy --dry-run -c wrangler.mainnet-mock-harness.toml

      - name: Git diff whitespace check
        run: git diff --exit-code
