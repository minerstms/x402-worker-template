name: Release archive verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify exact Node and npm toolchain
        run: |
          node --version
          npm --version
          npm run check:runtime

      - name: Install dependencies
        run: npm ci

      - name: GitHub action pin check
        run: npm run check:actions

      - name: History security scan and classification
        run: npm run security:scan:history

      - name: Create safe release archive
        run: npm run release:archive

      - name: Verify release archive reproducibility
        run: npm run verify:archive
