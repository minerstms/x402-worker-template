name: Release archive verification

on:
  workflow_dispatch:

jobs:
  verify-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify release archive reproducibility
        run: npm run verify:archive
